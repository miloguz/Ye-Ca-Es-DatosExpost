[project]
name = "proyecto1especializacion"
version = "0.2.0"
description = "Análisis de procesos RPA con agente SQL local y predicción de ROI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "streamlit>=1.40.0",
    "ollama>=0.4.0",
    "plotly>=5.24.0",
    "xgboost>=2.1.0",
    "joblib>=1.4.0",
    "nbformat>=5.10.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.9",
]

[project.scripts]
app = "app.chat:main"

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
]
